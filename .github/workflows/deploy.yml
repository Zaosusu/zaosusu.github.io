name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build
        run: npm run build
        env:
          # 平台自动注入的临时凭证，仓库里无需配置任何 secret，job 结束即失效。
          # 作用仅是把 GitHub API 的匿名限流（60 次/小时）提到 5000 次/小时；
          # 即使这里不传，构建也会匿名拉取并在失败时沿用旧值，不会中断。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: SPA fallback
        run: cp dist/index.html dist/404.html
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
